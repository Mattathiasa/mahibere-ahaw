<!doctype html>
<!-- Amharic matches DEFAULT_LANGUAGE in src/contexts/LanguageContext.tsx, which
     is what renders before any JavaScript runs. LanguageProvider updates this
     attribute when the reader picks a different language. -->
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahibere Ahaw - Church Management System</title>
    <meta name="description" content="Comprehensive church management platform for Ethiopian Orthodox Tewahedo Church - Mahibere Ahaw Yekiristos Betekerstian" />
    <meta name="author" content="Mahibere Ahaw Church Management" />

    <meta property="og:title" content="Mahibere Ahaw - Church Management System" />
    <meta property="og:description" content="Manage church activities, members, announcements, and reports efficiently" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MahibereAhaw" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <!--
      Pre-boot splash. The app is a Vite SPA, so between first paint and the JS
      bundle mounting there is nothing in #root — on a slow connection that is
      a second or more of blank white, even in dark mode.

      This is deliberately plain CSS with no build step, and it is removed by
      src/main.tsx once React mounts. The background is chosen synchronously
      from the same localStorage key ThemeContext seeds itself from, so the
      splash can never flash the wrong colour before the app takes over.
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #e7f0fa;
        transition: opacity 0.4s ease-out;
        user-select: none;
      }
      #boot-splash.is-dark { background: #0d2440; }
      #boot-splash.is-hiding { opacity: 0; pointer-events: none; }
      #boot-splash .seal-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-splash .halo {
        position: absolute;
        inset: -24px;
        border-radius: 9999px;
        background: rgba(250, 187, 42, 0.25);
        filter: blur(28px);
        animation: natural-breathe 4.5s ease-in-out infinite;
      }
      #boot-splash .seal {
        position: relative;
        width: 120px;
        height: 120px;
        padding: 8px;
        border-radius: 9999px;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(250, 187, 42, 0.4), 0 20px 40px rgba(13, 36, 64, 0.1);
      }
      #boot-splash.is-dark .seal {
        box-shadow: 0 0 0 1px rgba(250, 187, 42, 0.4), 0 20px 40px rgba(0, 0, 0, 0.45);
      }
      #boot-splash img {
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        object-fit: contain;
      }
      #boot-splash .text-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #boot-splash .brand-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #2e5e99;
      }
      #boot-splash.is-dark .brand-title {
        color: #7ba4d0;
      }
      #boot-splash .welcome-sub {
        font-size: 13px;
        font-weight: 500;
        color: rgba(46, 94, 153, 0.7);
      }
      #boot-splash.is-dark .welcome-sub {
        color: rgba(123, 164, 208, 0.8);
      }
      @keyframes natural-breathe {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.08); opacity: 0.65; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .halo { animation: none; opacity: 0.4; }
      }
    </style>
    <div id="root"></div>
    <!-- A sibling of #root, not a child: React clears its container on mount,
         which would yank the splash away instead of letting it fade out. -->
    <div id="boot-splash">
      <div class="seal-wrap">
        <div class="halo"></div>
        <div class="seal"><img src="/logo.png" alt="Mahibere Ahaw" /></div>
      </div>
      <div class="text-group">
        <span class="brand-title">MAHIBERE AHAW</span>
        <span class="welcome-sub">እንኳን ደህና መጡ • Welcome</span>
      </div>
    </div>
    <!--
      CAUTION: the SHA-256 of the script below is pinned in the
      Content-Security-Policy in vercel.json. Allowing it with 'unsafe-inline'
      instead would have permitted every inline script on every page and left the
      policy close to decorative.

      Editing this script AT ALL — whitespace and its inner comment included —
      changes the hash, and the browser then silently refuses to run it: the
      splash paints light-themed for a dark-mode reader. `npm run check` fails on
      a drifted hash and prints the replacement. See scripts/check-csp-hash.mjs.
    -->
    <script>
      // Inline and synchronous: it has to run before the splash paints.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.getElementById('boot-splash').className = 'is-dark';
        }
      } catch (e) { /* private mode — the light default is fine */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
